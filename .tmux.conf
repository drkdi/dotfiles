# ============================================================================
# TMUX CONFIGURATION
# ============================================================================
#
# CHANGES MADE (2026-02-04):
# --------------------------
# 1. REMOVED: Duplicate bind -n S-Left/S-Right (was defined twice)
#
# 2. REMOVED: Conflicting $is_vim vs $not_tmux bindings (kept $is_vim)
#
# 3. REMOVED: Duplicate window-status-format definitions (were overwritten)
#
# 4. REMOVED: Emoji separator (💩💩💩)
#
# 5. REMOVED: Dead commented code blocks
#
# 6. ADDED: Missing 'run ~/.tmux/plugins/tpm/tpm' for plugins to work
#
# 7. ORGANIZED: Grouped settings into logical sections
#
# KEYBINDINGS SUMMARY:
#   prefix = C-b
#   prefix + r        = reload config
#   prefix + %        = vertical split (keeps path)
#   prefix + "        = horizontal split (keeps path)
#   prefix + c        = new window (keeps path)
#   C-h/j/k/l         = pane navigation (vim-aware)
#   prefix + k        = rotate pane layout in current window
#   prefix + l        = cycle specific layouts
#   Shift+Left/Right  = prev/next window
#   C-0..9            = jump to window by number
#   prefix + -/+      = swap window left/right
#   prefix + T        = swap window to position 1
#   prefix + >/<      = resize pane
#   prefix + =        = even-horizontal layout
#   prefix + j        = join panes from previous window into current window
#   prefix + C-s      = save session (resurrect)
#   prefix + C-r      = restore session (resurrect)
#
# ============================================================================

# ============================================================================
# GENERAL OPTIONS
# ============================================================================

set -g prefix C-b
set -g base-index 1                    # Start windows at 1
set -g history-limit 10000
set -g mouse on
set -g mode-keys vi
set -sg escape-time 0                  # No delay for escape key
set -s copy-command "pbcopy"
set -g set-clipboard on                # Clipboard integration for vim
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Pane backgrounds should stay default so terminal opacity remains visible.
set -g window-style "bg=default"
set -g window-active-style "bg=default"

set-option -g renumber-windows on
set-option -g status-keys "emacs"

# Auto-rebalance panes when one is closed
set-hook -g after-kill-pane 'select-layout even-horizontal'
set-hook -g pane-exited 'select-layout even-horizontal'

# ============================================================================
# KEY BINDINGS - General
# ============================================================================

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Send prefix to nested session
bind-key -n C-q send-prefix

# Safety guard: allow normal detach, except when current pane is Codex CLI.
unbind d
unbind C-d
bind-key d if-shell -F '#{==:#{pane_current_command},codex}' 'display-message "Detach blocked in Codex pane. Exit Codex first."' 'detach-client'
bind-key C-d if-shell -F '#{==:#{pane_current_command},codex}' 'display-message "Detach blocked in Codex pane. Exit Codex first."' 'detach-client'

# ============================================================================
# KEY BINDINGS - Windows & Panes
# ============================================================================

# Split panes (keep current path)
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -ac "#{pane_current_path}"
bind x confirm-before -p "kill-window #W? (y/n)" kill-window
bind X confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Jump to first/last pane in current window (by pane index)
bind J run-shell "tmux list-panes -F '#{pane_index}' | sort -n | head -n1 | xargs -I{} tmux select-pane -t:.{}"
bind K run-shell "tmux list-panes -F '#{pane_index}' | sort -n | tail -n1 | xargs -I{} tmux select-pane -t:.{}"

# Window navigation
bind H select-window -t :^
bind L select-window -t :$
bind -n S-Left previous-window
bind -n S-Right next-window
bind-key -n F9 last-window

# Quick window access (Ctrl+number)
bind-key -n C-0 select-window -t 0
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

# Swap windows
bind-key -r - swap-window -t -1 \; previous-window
bind-key -r + swap-window -t +1 \; next-window
bind-key T swap-window -t 1

# ============================================================================
# KEY BINDINGS - Vim-aware Pane Navigation
# ============================================================================

# Smart pane switching: works with vim/fzf
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -r h select-pane -L
bind-key k run-shell 'pane_count="$(tmux list-panes -F "##{pane_id}" | wc -l | tr -d " ")"; if [ "$pane_count" -eq 2 ]; then first="$(tmux list-panes -F "##{pane_left} ##{pane_top}" | sed -n "1p")"; second="$(tmux list-panes -F "##{pane_left} ##{pane_top}" | sed -n "2p")"; l1="${first%% *}"; t1="${first#* }"; l2="${second%% *}"; t2="${second#* }"; if [ "$l1" != "$l2" ] && [ "$t1" = "$t2" ]; then tmux select-layout even-vertical; tmux display-message "Rotated: vertical split -> horizontal split"; elif [ "$t1" != "$t2" ] && [ "$l1" = "$l2" ]; then tmux select-layout even-horizontal; tmux display-message "Rotated: horizontal split -> vertical split"; else tmux select-layout next; tmux display-message "Rotated layout"; fi; else tmux select-layout next; tmux display-message "Rotated layout"; fi'
bind-key l run-shell 'idx="$(tmux show-options -w -v @layout_cycle_idx 2>/dev/null || echo 0)"; case "$idx" in ""|*[!0-9]*) idx=0;; esac; next="$(( (idx + 1) % 5 ))"; case "$next" in 0) layout="even-horizontal";; 1) layout="even-vertical";; 2) layout="tiled";; 3) layout="main-horizontal";; 4) layout="main-vertical";; esac; tmux select-layout "$layout"; tmux set-option -wq @layout_cycle_idx "$next"; tmux display-message "Layout: $layout"'

# Merge panes from previous numeric window in the current session (e.g. 0:10 <- 0:9).
bind-key j run-shell 'current_idx="#{window_index}"; current_window_id="#{window_id}"; prev_idx="$(tmux list-windows -F "##{window_index}" | awk -v cur="$current_idx" '\''$1 < cur { p=$1 } END { print p }'\'')"; [ -n "$prev_idx" ] || { tmux display-message "No previous numeric window to join (current=$current_idx)"; exit 0; }; prev_window_id="$(tmux list-windows -F "##{window_index} ##{window_id}" | awk -v p="$prev_idx" '\''$1 == p { print $2; exit }'\'')"; [ -n "$prev_window_id" ] || { tmux display-message "Window index $prev_idx not found"; exit 0; }; tmux list-panes -t "$prev_window_id" -F "##{pane_id}" | while IFS= read -r pane_id; do [ -n "$pane_id" ] && tmux join-pane -h -s "$pane_id" -t "$current_window_id"; done; tmux select-layout -t "$current_window_id" even-vertical; tmux display-message "Joined panes from window $prev_idx (vertical splits)"'

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Copy mode + visual workflow
bind-key v copy-mode

# New vim window shortcut
bind-key -r V new-window \; send-keys "vim" Enter

# ============================================================================
# KEY BINDINGS - Resize
# ============================================================================

bind-key -r > resize-pane -R 50
bind-key -r < resize-pane -L 50
bind-key -r = select-layout tiled

# ============================================================================
# KEY BINDINGS - Copy Mode (vi)
# ============================================================================

bind P paste-buffer
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# Mouse copy
bind -T root MouseDown1Pane select-pane -t= \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M"
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 50 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 50 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 50 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 50 scroll-down
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind U run-shell 'tmux capture-pane -pJ -S -200 | pbcopy; tmux display-message "Copied last 200 lines (joined wraps)"'

# ============================================================================
# STATUS BAR
# ============================================================================

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e2132"

# Left side (empty)
set -g status-left ""
set -g status-left-length 50

# Right side (date/time)
set -g status-right "%a %d %b, #[fg=white]%I:%M"
set -g status-right-style "fg=white"
set -g status-right-length 25

# Window tabs
set -g allow-rename off
set -g automatic-rename off
set -g allow-set-title off
set -g set-titles off
set -g window-status-separator "  "
set -g window-status-style "fg=#6b7089"
set -g window-status-format "#[fg=blue]#[fg=black,bg=blue]#I #[bg=brightblack,fg=white] #W#[fg=brightblack,bg=default] "
set -g window-status-current-format "#[fg=yellow]#[fg=black,bg=yellow]#I #[bg=brightblack,fg=white] #W#[fg=brightblack,bg=default] "
set -g window-status-current-style "bold"


# ============================================================================
# PLUGINS
# ============================================================================
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press: prefix + I (to install plugins)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'
# prefix + Ctrl-s = save session
# prefix + Ctrl-r = restore session

# Initialize TPM (keep at bottom, only if installed)
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
set -g focus-events on
