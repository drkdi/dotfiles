# ============================================================================
# STARSHIP PROMPT CONFIGURATION
# ============================================================================
# Docs: https://starship.rs/config/
#
# CREATED (2026-02-04):
# - Minimal, fast prompt matching your dark theme
# - Shows: directory, git branch/status, command duration, error indicator
# - Disabled: package versions, language versions (too noisy)
#
# ============================================================================

# Prompt format
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Disable the blank line at the start of the prompt
add_newline = false

# ============================================================================
# DIRECTORY
# ============================================================================

[directory]
# Show full path (e.g. ~/github/cloud) instead of truncated
truncation_length = 0
truncate_to_repo = false
style = "bold cyan"
read_only = " 🔒"

# ============================================================================
# GIT
# ============================================================================

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = '([$conflicted$stashed$staged$modified$renamed$untracked$deleted$ahead_behind]($style) )'
style = "bold yellow"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count}"

# ============================================================================
# COMMAND DURATION
# ============================================================================

[cmd_duration]
min_time = 2_000  # Show if command takes > 2s
format = "[$duration]($style) "
style = "bold yellow"

# ============================================================================
# PROMPT CHARACTER
# ============================================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ============================================================================
# DISABLED MODULES (for speed)
# ============================================================================

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[terraform]
disabled = true
